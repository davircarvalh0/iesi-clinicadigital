# Sobe tudo com: docker compose up --build --wait
# Portas publicadas no host são configuráveis (veja .env.example) para rodar um ambiente isolado em paralelo.
name: iesi-clinicadigital

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "${RABBITMQ_PORTA:-5672}:5672"
      - "${RABBITMQ_PAINEL_PORTA:-15672}:15672" # painel: http://localhost:15672 (clinica/clinica)
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-dados:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Um banco por serviço: nenhum serviço lê o banco de outro.
  db-agendamento:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agendamento
      POSTGRES_PASSWORD: agendamento
      POSTGRES_DB: agendamento
    ports:
      - "${DB_AGENDAMENTO_PORTA:-5433}:5432"
    volumes:
      - db-agendamento-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendamento -d agendamento"]
      interval: 3s
      retries: 20

  db-notificacao:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notificacao
      POSTGRES_PASSWORD: notificacao
      POSTGRES_DB: notificacao
    ports:
      - "${DB_NOTIFICACAO_PORTA:-5434}:5432"
    volumes:
      - db-notificacao-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notificacao -d notificacao"]
      interval: 3s
      retries: 20

  db-cadastro:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cadastro
      POSTGRES_PASSWORD: cadastro
      POSTGRES_DB: cadastro
    ports:
      - "${DB_CADASTRO_PORTA:-5435}:5432"
    volumes:
      - db-cadastro-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadastro -d cadastro"]
      interval: 3s
      retries: 20

  # Cada serviço aplica as próprias migrações ao iniciar (prisma migrate deploy) e só fica
  # "healthy" depois de responder em /saude, ou seja, com o banco migrado e o broker conectado.
  cadastro:
    build:
      context: .
      dockerfile: services/cadastro/Dockerfile
    restart: unless-stopped
    environment:
      PORTA: 3003
      AUTH_SECRET: ${AUTH_SECRET:-}
      TEST_CONTROLS: ${TEST_CONTROLS:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RECUPERACAO_REMETENTE: ${RECUPERACAO_REMETENTE:-}
      DATABASE_URL: postgresql://cadastro:cadastro@db-cadastro:5432/cadastro
      RABBITMQ_URL: amqp://clinica:clinica@rabbitmq:5672
    ports:
      - "${CADASTRO_PORTA:-3003}:3003"
    depends_on:
      db-cadastro: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3003/saude"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 60s
      start_interval: 2s

  cadastro-identidade:
    build:
      context: .
      dockerfile: services/cadastro/Dockerfile
    command: ["node", "dist/identidade.js"]
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET:-}
      DATABASE_URL: postgresql://cadastro:cadastro@db-cadastro:5432/cadastro
    depends_on:
      cadastro: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3010/saude"]
      interval: 5s
      timeout: 3s
      retries: 6

  agendamento:
    build:
      context: .
      dockerfile: services/agendamento/Dockerfile
    restart: unless-stopped
    environment:
      PORTA: 3001
      AUTH_SECRET: ${AUTH_SECRET:-}
      CADASTRO_AUTH_URL: http://cadastro-identidade:3010
      TEST_CONTROLS: ${TEST_CONTROLS:-false}
      DATABASE_URL: postgresql://agendamento:agendamento@db-agendamento:5432/agendamento
      RABBITMQ_URL: amqp://clinica:clinica@rabbitmq:5672
    ports:
      - "${AGENDAMENTO_PORTA:-3001}:3001"
    depends_on:
      db-agendamento: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      cadastro-identidade: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/saude"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 60s
      start_interval: 2s

  notificacao:
    build:
      context: .
      dockerfile: services/notificacao/Dockerfile
    restart: unless-stopped
    environment:
      PORTA: 3002
      AUTH_SECRET: ${AUTH_SECRET:-}
      CADASTRO_AUTH_URL: http://cadastro-identidade:3010
      TEST_CONTROLS: ${TEST_CONTROLS:-false}
      DATABASE_URL: postgresql://notificacao:notificacao@db-notificacao:5432/notificacao
      RABBITMQ_URL: amqp://clinica:clinica@rabbitmq:5672
      LEMBRETE_ANTECEDENCIA_MINUTOS: ${LEMBRETE_ANTECEDENCIA_MINUTOS-1440}
      ROTINA_ENVIO_INTERVALO_MS: ${ROTINA_ENVIO_INTERVALO_MS-5000}
      ENVIO_MAX_TENTATIVAS: ${ENVIO_MAX_TENTATIVAS-3}
      CANAL_ENVIO: ${CANAL_ENVIO:-log}
      ENVIO_AUTOMATICO_HABILITADO: ${ENVIO_AUTOMATICO_HABILITADO:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      LEMBRETE_EMAIL_REMETENTE: ${LEMBRETE_EMAIL_REMETENTE:-}
      LEMBRETE_EMAIL_DESTINOS_PERMITIDOS: ${LEMBRETE_EMAIL_DESTINOS_PERMITIDOS:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TEMPLATE: ${WHATSAPP_TEMPLATE:-hello_world}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-en_US}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_DESTINOS_PERMITIDOS: ${WHATSAPP_DESTINOS_PERMITIDOS:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      ENVIO_RESERVA_EXPIRA_MS: ${ENVIO_RESERVA_EXPIRA_MS-60000}
      OPERACAO_HABILITADA: ${OPERACAO_HABILITADA:-false}
    ports:
      - "${NOTIFICACAO_PORTA:-3002}:3002"
    depends_on:
      db-notificacao: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      cadastro-identidade: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3002/saude"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 60s
      start_interval: 2s

  recepcao:
    build:
      context: .
      dockerfile: apps/recepcao/Dockerfile
    restart: unless-stopped
    ports:
      - "${RECEPCAO_PORTA:-8080}:80" # tela: http://localhost:8080
    depends_on:
      agendamento: { condition: service_healthy }
      notificacao: { condition: service_healthy }
      cadastro: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s
      start_interval: 2s

volumes:
  rabbitmq-dados:
  db-agendamento-dados:
  db-notificacao-dados:
  db-cadastro-dados:
