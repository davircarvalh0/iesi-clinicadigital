server {
  listen 80;
  root /usr/share/nginx/html;

  # DNS do Docker: resolve os serviços a cada requisição, para sobreviver a recriações de containers.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $agendamento agendamento:3001;
  set $notificacao notificacao:3002;

  location /api/agendamento/ {
    rewrite ^/api/agendamento/(.*)$ /$1 break;
    proxy_pass http://$agendamento;
  }
  location /api/notificacao/ {
    rewrite ^/api/notificacao/(.*)$ /$1 break;
    proxy_pass http://$notificacao;
  }

  location / { try_files $uri /index.html; }
}
